<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>魔方 GO</title>
    <meta property="og:title" content="魔方 GO">
    <meta property="og:description" content="Бросьте вызов друзьям в соревновании GO!">
    <meta property="og:image" content="https://mofanggo.com/assets/mofanggo.png">
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
<div class="browser-tip">
    <span>Если приложение не открылось автоматически, нажмите ⋯ и выберите «Открыть в браузере».</span>
</div>
<div class="container">
    <div class="launcher-card">
        <img class="icon-placeholder"
             src="../assets/mofanggo.png"
             alt="Cubing GO"
             width="100%"
             height="100%"
             style="border-radius:13px;">
        <h3>魔方 GO</h3>
        <div class="desktop-view">
            <h2>Варианты загрузки</h2>
            <div class="download-options">
                <a href="https://apps.apple.com/us/app/mofanggo-go-app/id6768899720"
                   class="btn btn-store btn-appstore">
                    <span>App Store</span>
                </a>
                <a href="https://url.cloud.huawei.com/B8MEeHnsXe"
                   class="btn btn-store btn-googleplay">
                    <span>Huawei AppGallery</span>
                </a>
            </div>
            <p class="desktop-hint">Выберите платформу для загрузки приложения</p>

        </div>
    </div>
</div>
</body>
</html>
