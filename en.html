<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoFang GO</title>
    <meta property="og:title" content="MoFang GO">
    <meta property="og:description" content="Challenge your friends in a GO Challenge!">
    <meta property="og:image" content="https://mofanggo.com/assets/mofanggo.png">
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
<div class="browser-tip">
    <span>If the app doesn't open automatically, tap ⋯ and choose \"Open in Browser\".</span>
</div>
<div class="container">
    <div class="launcher-card">
        <img class="icon-placeholder"
             src="../assets/mofanggo.png"
             alt="MoFang GO"
             width="100%"
             height="100%"
             style="border-radius:13px;">
        <h3>MoFang GO</h3>
        <div class="desktop-view">
            <h2>Download Options</h2>
            <div class="download-options">
                <a href="https://apps.apple.com/us/app/mofanggo-go-app/id6768899720"
                   class="btn btn-store btn-appstore">
                    <span>App Store</span>
                </a>
                <a href="https://play.google.com/store/apps/details?id=shanfangjie.lgf.mf"
                   class="btn btn-store btn-googleplay">
                    <span>Google Play</span>
                </a>
            </div>
            <p class="desktop-hint">Choose your preferred platform to download the app</p>

        </div>
    </div>
</div>
</body>
</html>
