<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>キューブ GO</title>
    <meta property="og:title" content="キューブ GO">
    <meta property="og:description" content="友達と勝負！GOチャレンジに参加しよう！">
    <meta property="og:image" content="https://mofanggo.com/assets/mofanggo.png">
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
<div class="browser-tip">
    <span>アプリが自動で開かない場合は、右上の ⋯ をタップして「ブラウザで開く」を選択してください。</span>
</div>
<div class="container">
    <div class="launcher-card">
        <img class="icon-placeholder"
             src="../assets/mofanggo.png"
             alt="Cubing GO"
             width="100%"
             height="100%"
             style="border-radius:13px;">
        <h3>キューブ GO</h3>
        <div class="desktop-view">
            <h2>ダウンロード方法</h2>
            <div class="download-options">
                <a href="https://apps.apple.com/us/app/mofanggo-go-app/id6768899720"
                   class="btn btn-store btn-appstore">
                    <span>App Store</span>
                </a>
                <a href="https://appgallery.huawei.com/app/C118020095"
                   class="btn btn-store btn-googleplay">
                    <span>Huawei AppGallery</span>
                </a>
            </div>
            <p class="desktop-hint">ご利用のプラットフォームを選択してください</p>

        </div>
    </div>
</div>
</body>
</html>
