<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>큐브 GO</title>
    <meta property="og:title" content="큐브 GO">
    <meta property="og:description" content="친구들과 대결하세요! GO 챌린지에 참여하세요!">
    <meta property="og:image" content="https://mofanggo.com/assets/mofanggo.png">
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
<div class="browser-tip">
    <span>앱이 자동으로 열리지 않으면 오른쪽 상단의 ⋯ 버튼을 눌러 '브라우저에서 열기'를 선택하세요.</span>
</div>
<div class="container">
    <div class="launcher-card">
        <img class="icon-placeholder"
             src="../assets/mofanggo.png"
             alt="Cubing GO"
             width="100%"
             height="100%"
             style="border-radius:13px;">
        <h3>큐브 GO</h3>
        <div class="desktop-view">
            <h2>다운로드 방법</h2>
            <div class="download-options">
                <a href="https://apps.apple.com/us/app/mofanggo-go-app/id6768899720"
                   class="btn btn-store btn-appstore">
                    <span>App Store</span>
                </a>
                <a href="https://url.cloud.huawei.com/B8MEeHnsXe"
                   class="btn btn-store btn-googleplay">
                    <span>Huawei AppGallery</span>
                </a>
            </div>
            <p class="desktop-hint">원하는 플랫폼을 선택하여 앱을 다운로드하세요</p>
        </div>
    </div>
</div>
</body>
</html>
