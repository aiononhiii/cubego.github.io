<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>魔方 GO</title>
    <meta property="og:title" content="魔方 GO">
    <meta property="og:description" content="一决高下，加入好友 GO 挑战！">
    <meta property="og:image" content="https://mofanggo.com/assets/mofanggo.png">
    <link rel="stylesheet" href="../styles.css">
</head>

<body>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById("browserTip").style.display =
                isWeChat() ? "block" : "none";
            document.getElementById("openButtonTip").style.display =
                isWeChat() ? "none" : "block";
        });
        function isWeChat() {
            return /MicroMessenger/i.test(navigator.userAgent);
        }
        function openCubeApp() {
            const base = "mofanggo://go";
            const params = window.location.search;
            const jumpUrl = base + params;
            window.location.href = jumpUrl;
        }
        function updateButtonText() {
            const params = new URLSearchParams(window.location.search);
            const go = params.get("GO");
            if (go) {
                document.getElementById("openBtn").textContent = `点击我开启魔方GO - ${go}`;
            }
        }
    </script>
    <div id="browserTip" class="browser-tip">
        <span>如果应用未自动打开，请点击右上角 ⋯ 并选择\"在浏览器打开\"。</span>
    </div>
    <div id="openButtonTip" class="open-button-tip">
        <span id="openBtn" class="btn-top btn-top-store btn-top-googleplay" onclick="openCubeApp()">点击我开启魔方GO</span>
    </div>
    <div class="container">
        <div class="launcher-card">
            <img class="icon-placeholder" src="../assets/mofanggo.png" alt="Cubing GO" width="100%" height="100%"
                style="border-radius:13px;">
            <h3>魔方 GO</h3>
            <div class="desktop-view">
                <h2>下载方式</h2>
                <div class="download-options">
                    <a href="https://apps.apple.com/us/app/mofanggo-go-app/id6768899720"
                        class="btn btn-store btn-appstore">
                        <span>App Store</span>
                    </a>
                    <a href="" class="btn btn-store btn-googleplay">
                        <span>Coming soon on Huawei AppGallery</span>
                    </a>
                </div>
                <p class="desktop-hint">请选择您希望下载的平台</p>
            </div>
        </div>
    </div>

    <div class="icp-footer">
        <a href="https://beian.miit.gov.cn/" target="_blank">浙ICP备2026047506号</a>
    </div>

</body>

</html>
