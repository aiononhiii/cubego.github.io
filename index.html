<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="appName"></title>
    <meta property="og:image" content="https://mofanggo.com/assets/mofanggo.png" />
    <link rel="stylesheet" href="./styles.css">
</head>

<body>
<div class="container">
    <div class="launcher-card">
        <img class="icon-placeholder"
             src="./assets/mofanggo.png"
             alt="MoFang GO"
             width="100%"
             height="100%"
             style="border-radius: 13px;">

        <h3 id="appName"></h3>

        <div class="desktop-view">

            <h2 id="title"></h2>

            <div class="download-options">
                <a href="https://apps.apple.com/us/app/mofanggo-go-app/id6768899720"
                   class="btn btn-store btn-appstore">

                    <svg xmlns="http://www.w3.org/2000/svg"
                         width="24"
                         height="24"
                         viewBox="0 0 24 24"
                         fill="currentColor">
                        <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/>
                    </svg>

                    <span>App Store</span>
                </a>

                <a href="https://play.google.com/store/apps/details?id=shanfangjie.lgf.mf"
                   class="btn btn-store btn-googleplay">

                    <svg xmlns="http://www.w3.org/2000/svg"
                         width="24"
                         height="24"
                         viewBox="0 0 24 24"
                         fill="currentColor">
                        <path d="M3.609 1.814L13.792 12 3.61 22.186c-.287-.183-.463-.504-.463-.876V2.69c0-.372.176-.693.463-.876zm10.89 10.89l2.348 2.348-10.06 5.818 7.712-8.166zm2.348-3.756l-2.348 2.348-7.712-8.166 10.06 5.818zm1.232.712l2.312 1.337c.812.47.812 1.537 0 2.006l-2.312 1.337L15.73 12l2.349-2.34z"/>
                    </svg>

                    <span>Google Play</span>
                </a>
            </div>

            <p id="hint" class="desktop-hint"></p>

        </div>
    </div>
</div>

<script>
const translations = {
    en_US: {
        appName: "MoFang GO",
        title: "Download Options",
        hint: "Choose your preferred platform to download the app"
    },

    zh_CN: {
        appName: "魔方 GO",
        title: "下载方式",
        hint: "请选择您希望下载的平台"
    },

    zh_HK: {
        appName: "魔方 GO",
        title: "下載方式",
        hint: "請選擇您希望下載的平台"
    },

    ja_JP: {
        appName: "キューブ GO",
        title: "ダウンロード方法",
        hint: "ご利用のプラットフォームを選択してください"
    },

    ko_KR: {
        appName: "큐브 GO",
        title: "다운로드 방법",
        hint: "원하는 플랫폼을 선택하여 앱을 다운로드하세요"
    }
};

const params = new URLSearchParams(window.location.search);

const lang =
    params.get('lang') ||
    navigator.language.replace('-', '_');

const locale =
    translations[lang] ||
    translations[lang?.split('_')[0] + '_US'] ||
    translations.en_US;

document.documentElement.lang = lang;

document.getElementById('title').textContent = locale.title;
document.getElementById('hint').textContent = locale.hint;
</script>

</body>
</html>
