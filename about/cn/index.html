<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>关于魔方 GO</title>

    <link rel="stylesheet" href="../../styles.css">

    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial;
            background: #fff;
            color: #222;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 24px;
        }

        .logo {
            width: 90px;
            height: 90px;
            border-radius: 20px;
        }

        h1 {
            margin: 20px 0 10px;
        }

        .section {
            margin-top: 30px;
        }

        p {
            line-height: 1.7;
            color: #333;
        }

        .card {
            background: #f6f6f6;
            padding: 16px;
            border-radius: 12px;
            margin-top: 10px;
        }
    </style>

</head>

<body>

    <div class="container">

        <img class="logo" src="../../assets/mofanggo.png" />

        <h1>
            魔方 GO
        </h1>

        <p>
            速拧计时与挑战应用
        </p>

        <div class="section">
            <h3>
                关于
            </h3>

            <p>
                魔方 GO 是一款速拧计时与挑战平台，用于练习、及共享复原体验。
            </p>
        </div>

        <div class="section">
            <h3>
                理念
            </h3>

            <p>
                我们专注于简洁、公平与纯粹的复原体验。
                没有干扰，只有你、魔方与时间。
            </p>
        </div>

        <div class="section">
            <h3>
                GO 训练
            </h3>
            <p>
                GO 训练功能允许玩家共享同一次计时打乱。
            </p>
        </div>

        <div class="section">
            <h3>
                隐私
            </h3>

            <p>
                所有解法数据均保存在您的设备本地。
                我们不会收集或上传任何个人数据。
        </div>

        <div class="section">
            <h3>
                支持
            </h3>

            <div class="card">
                support@mofanggo.com
            </div>
        </div>

    </div>

    <div class="icp-footer">
        <a href="https://beian.miit.gov.cn/" target="_blank">浙ICP备2026047506号</a>
    </div>

</body>

</html>
