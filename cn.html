<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>魔方 GO</title>
    <meta property="og:title" content="魔方 GO">
    <meta property="og:description" content="一决高下，加入好友 GO 挑战！">
    <meta property="og:image" content="https://mofanggo.com/assets/mofanggo.png">
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
<div class="browser-tip">
    <span >如果应用未自动打开，请点击右上角 ⋯ 并选择\"在浏览器打开\"。</span>
</div>
<div class="container">
    <div class="launcher-card">
        <img class="icon-placeholder"
             src="../assets/mofanggo.png"
             alt="MoFang GO"
             width="100%"
             height="100%"
             style="border-radius:13px;">
        <h3>魔方 GO</h3>
        <div class="desktop-view">
            <h2>下载方式</h2>
            <div class="download-options">
                <a href="https://apps.apple.com/us/app/mofanggo-go-app/id6768899720"
                   class="btn btn-store btn-appstore">
                    <span>App Store</span>
                </a>
                <a href="https://play.google.com/store/apps/details?id=shanfangjie.lgf.mf"
                   class="btn btn-store btn-googleplay">
                    <span>Google Play</span>
                </a>
            </div>
            <p class="desktop-hint">请选择您希望下载的平台</p>
        </div>
    </div>
</div>
</body>
</html>
